[package]
name = "bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
resolver = "3"
default-run = "bot"
autobins = false
autotests = false

[dependencies]
teloxide = { version = "0.13", features = ["macros", "ctrlc_handler"] }
log = "0.4"
pretty_env_logger = "0.5"
tokio = { version =  "1.8", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.11.27", features = ["json", "stream"] }
httpdate = "1"
tokio-postgres = "0.7.12"
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
getrandom = "0.4"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
serde_urlencoded = "0.7"

[lib]
name = "bot"
path = "bot/src/lib.rs"

[[bin]]
name = "bot"
path = "bot/src/main.rs"

[[bin]]
name = "check_bundle"
path = "bot/src/bin/check_bundle.rs"

[[test]]
name = "bundle"
path = "bot/tests/bundle.rs"

[[test]]
name = "dialogue"
path = "bot/tests/dialogue.rs"

[[test]]
name = "feedback"
path = "bot/tests/feedback.rs"

[[test]]
name = "ratings"
path = "bot/tests/ratings.rs"

[[test]]
name = "recommendations"
path = "bot/tests/recommendations.rs"

[[test]]
name = "search"
path = "bot/tests/search.rs"

[[test]]
name = "startup"
path = "bot/tests/startup.rs"
