[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "anime-recommendation-recsys"
version = "0.1.0"
description = "Anime recommendation bot and offline recommendation preparation"
readme = "recsys/README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb==1.5.6", "numpy==2.5.3", "pandas==3.0.6"]

[project.optional-dependencies]
quality = ["scikit-learn==1.9.1"]
gpu = ["cupy-cuda12x[ctk]==14.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'", "cuda-toolkit==12.9.2; sys_platform == 'linux' and platform_machine == 'x86_64'", "cuda-pathfinder==1.8.3; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
data = ["dvc==3.67.1"]
lint = ["ruff==0.17.1"]

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
python-source = "src"
module-name = "recsys"
data = "packaging"
targets = [{ name = "bot", kind = "bin" }, { name = "check_bundle", kind = "bin" }]
profile = "dev"
editable-profile = "dev"
locked = true
compatibility = "off"
auditwheel = "skip"

[tool.uv]
required-version = "==0.11.12"
cache-keys = [
  { file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" },
  { file = "packaging/scripts/recsys" },
  { file = "rust-toolchain.toml" }, { file = "rust-toolchain" }, { file = "build.rs" },
  { file = ".cargo/config*" }, { file = "bot/src/**/*.rs" }, { file = "bot/migrations/**/*.sql" },
  { file = "src/recsys/**/*.py" }, { file = "src/recsys/**/*.json" },
  { file = "src/recsys/**/*.md" }, { file = "recsys/README.md" },
  { env = "RUSTUP_TOOLCHAIN" }, { env = "RUSTFLAGS" }, { env = "CARGO_ENCODED_RUSTFLAGS" },
  { env = "CARGO_BUILD_TARGET" }, { env = "MATURIN_PEP517_ARGS" }, { env = "OPENSSL_DIR" },
  { env = "OPENSSL_LIB_DIR" }, { env = "OPENSSL_INCLUDE_DIR" }, { env = "OPENSSL_STATIC" },
  { env = "PKG_CONFIG_PATH" }, { env = "CC" }, { env = "CFLAGS" },
]

[tool.uv.extra-build-variables]
anime-recommendation-recsys = { MATURIN_NO_INSTALL_RUST = "1" }

[tool.ruff]
required-version = "==0.17.1"
target-version = "py312"
line-length = 100
indent-width = 4
src = ["src"]
force-exclude = true
include = ["*.py", "packaging/scripts/recsys"]
# ARB-054 removes this exclusion together with the versioned package/provenance migration.
extend-exclude = ["src/recsys"]
preview = false
unsafe-fixes = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["recsys"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
