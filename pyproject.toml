[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "anime-recommendation-recsys"
version = "0.5.1"
description = "Anime recommendation bot and offline recommendation preparation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb==1.5.6", "numpy==2.5.3", "pandas==3.0.6"]

[project.optional-dependencies]
quality = ["scikit-learn==1.9.1"]
torch-cpu = ["torch==2.13.0+cpu", "safetensors==0.8.0"]
torch-cuda = ["torch==2.13.0+cu129", "safetensors==0.8.0", "cuda-toolkit==12.9.1"]

[dependency-groups]
data = ["dvc==3.67.1"]
lint = ["ruff==0.17.1"]
typing = ["mypy==2.4.0", "scipy-stubs==1.18.1.1"]

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
python-source = "src"
module-name = "recsys"
data = "packaging"
targets = [{ name = "bot", kind = "bin" }, { name = "check_bundle", kind = "bin" }]
profile = "dev"
editable-profile = "dev"
locked = true
compatibility = "off"
auditwheel = "skip"

[tool.uv]
required-version = "==0.11.12"
conflicts = [[{ extra = "torch-cpu" }, { extra = "torch-cuda" }]]
cache-keys = [
  { file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" },
  { file = "packaging/scripts/recsys" },
  { file = "rust-toolchain.toml" }, { file = "rust-toolchain" }, { file = "build.rs" },
  { file = ".cargo/config*" }, { file = "bot/src/**/*.rs" }, { file = "bot/migrations/**/*.sql" },
  { file = "src/recsys/**/*.py" }, { file = "src/recsys/**/*.json" },
  { file = "src/recsys/**/*.md" }, { file = "README.md" },
  { env = "RUSTUP_TOOLCHAIN" }, { env = "RUSTFLAGS" }, { env = "CARGO_ENCODED_RUSTFLAGS" },
  { env = "CARGO_BUILD_TARGET" }, { env = "MATURIN_PEP517_ARGS" }, { env = "OPENSSL_DIR" },
  { env = "OPENSSL_LIB_DIR" }, { env = "OPENSSL_INCLUDE_DIR" }, { env = "OPENSSL_STATIC" },
  { env = "PKG_CONFIG_PATH" }, { env = "CC" }, { env = "CFLAGS" },
]

[tool.uv.extra-build-variables]
anime-recommendation-recsys = { MATURIN_NO_INSTALL_RUST = "1" }

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "torch-cpu" },
  { index = "pytorch-cu129", extra = "torch-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.ruff]
required-version = "==0.17.1"
target-version = "py312"
line-length = 100
indent-width = 4
src = ["src"]
force-exclude = true
include = ["*.py", "*.pyi", "packaging/scripts/recsys"]
preview = false
unsafe-fixes = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN001", "ANN002", "ANN003", "TC006"]

[tool.ruff.lint.isort]
known-first-party = ["recsys"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = [".", "packaging/scripts/recsys"]
mypy_path = [
  "$MYPY_CONFIG_FILE_DIR/src",
  "$MYPY_CONFIG_FILE_DIR/recsys/tests",
  "$MYPY_CONFIG_FILE_DIR/scripts",
  "$MYPY_CONFIG_FILE_DIR/typings",
]
namespace_packages = true
explicit_package_bases = true
exclude_gitignore = true
cache_dir = "$MYPY_CONFIG_FILE_DIR/.tools/mypy-cache"
follow_imports = "normal"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_any_explicit = true
disallow_any_unimported = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
pretty = false
enable_error_code = ["ignore-without-code"]
