[package]
name = "bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
resolver = "3"
default-run = "bot"

[dependencies]
teloxide = { version = "0.13", features = ["macros", "ctrlc_handler"] }
log = "0.4"
pretty_env_logger = "0.5"
tokio = { version =  "1.8", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7.12"
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
