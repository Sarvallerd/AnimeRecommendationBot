services:
  postgres:
    networks: [level1]
  prepare:
    networks: [level1]
  builder:
    network_mode: none
    volumes:
      - ./deploy/tests/build-fixture.py:/fixture/build-fixture.py:ro
  bot:
    command: ["--prepare"]
    restart: "no"
    networks: [level1]
    environment:
      TELOXIDE_TOKEN: 0:ci
networks:
  level1:
    internal: true
