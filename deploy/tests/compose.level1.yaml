services:
  postgres:
    image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    environment:
      POSTGRES_USER: arb_ci
      POSTGRES_PASSWORD: arb_ci
      POSTGRES_DB: arb_ci_test
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arb_ci -d arb_ci_test"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
