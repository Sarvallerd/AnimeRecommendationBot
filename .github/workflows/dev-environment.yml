name: Development environment

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dev-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.12'
      - name: Install Rust toolchain and native build prerequisites
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
      - name: Smoke test root environment
        run: python dev/tests/check_environment.py
      - name: Check root lock and existing metadata
        run: |
          uv lock --check
          git diff --exit-code -- uv.lock Cargo.lock
          git diff --check
